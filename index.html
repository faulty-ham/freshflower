<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>FreshFlower</title>
<meta name="theme-color" content="#13131c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0d0d12; --bg2:     #13131c; --bg3:    #1a1a27;
  --border:  rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #e8e6f0; --muted: #7a789a; --dim: #4a4868;
  --amber:  #f0a832; --amber-dim: rgba(240,168,50,0.12);
  --teal:   #2dd4a0; --teal-dim:  rgba(45,212,160,0.10);
  --coral:  #f06060; --coral-dim: rgba(240,96,96,0.10);
  --blue:   #4a90e2; --blue-dim:  rgba(74,144,226,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100dvh; }

/* -- Header -- */
header {
  background: var(--bg2); border-bottom: 1px solid var(--border2);
  padding: 16px 20px; position: sticky; top: 0; z-index: 10;
}
.header-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; color: var(--amber); line-height: 1; }
.stat-pill {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 100px;
  padding: 5px 12px; font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap;
}
.stat-pill strong { color: var(--text); }

/* -- Filters (multi-select dropdowns) -- */
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; position: relative; }
.ms { position: relative; }
.ms-btn {
  background: var(--bg3); border: 1px solid var(--border2); color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 8px 12px; border-radius: 8px;
  outline: none; cursor: pointer; min-width: 130px; text-align: left;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.ms-btn:hover { border-color: var(--amber); }
.ms-btn .arrow { color: var(--dim); font-size: 10px; }
.ms-panel {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
  background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px;
  min-width: 200px; max-height: 280px; overflow-y: auto; padding: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.ms.open .ms-panel { display: block; }
.ms-option {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px;
  cursor: pointer; font-size: 13px; color: var(--text);
}
.ms-option:hover { background: var(--bg2); }
.ms-option input { accent-color: var(--amber); cursor: pointer; }
.clear-filters {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  font-size: 12px; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-family: 'DM Mono', monospace;
}
.clear-filters:hover { color: var(--text); border-color: var(--border2); }

/* -- Modals -- */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 100; align-items: flex-start; justify-content: center; padding: 60px 20px;
  overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px;
  padding: 24px; width: 100%; max-width: 560px; max-height: 80vh; overflow-y: auto;
}
.modal h2 {
  font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px;
  color: var(--text); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;
}
.modal-close {
  background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-field { margin-bottom: 14px; }
.modal-field label {
  display: block; font-size: 11px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .03em; margin-bottom: 6px; font-family: 'DM Mono', monospace;
}
.modal-field input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 9px 11px; border-radius: 8px; outline: none;
}
.modal-field input:focus { border-color: var(--amber); }
.modal-hint { font-size: 11px; color: var(--dim); margin-top: 5px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.modal-btn-primary {
  background: var(--amber); border: none; color: #1a1200; font-weight: 700;
  padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 13px;
}
.modal-btn-primary:hover { opacity: 0.9; }
.modal-warn { color: var(--coral); font-size: 12px; margin-top: 6px; }
.sg-list-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sg-list-table th {
  text-align: left; color: var(--muted); font-size: 10px; text-transform: uppercase;
  padding: 6px 8px; border-bottom: 1px solid var(--border2); font-family: 'DM Mono', monospace;
}
.sg-list-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
.sg-list-table tr:hover td { background: var(--bg3); }

/* -- Content -- */
main { max-width: 900px; margin: 0 auto; padding: 20px; }
.state-msg { text-align: center; padding: 60px 20px; color: var(--dim); font-family: 'DM Mono', monospace; font-size: 13px; }
.spinner {
  width: 24px; height: 24px; border: 2px solid var(--border2); border-top-color: var(--amber);
  border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite; margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* -- Search group section -- */
.group { margin-bottom: 28px; }
.group-header {
  display: flex; align-items: baseline; gap: 10px; padding: 10px 4px;
  border-bottom: 1px solid var(--border2); margin-bottom: 2px; flex-wrap: wrap;
}
.group-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px;
  color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 6px;
}
.group-title:hover { color: var(--amber); }
.group-title .arrow { font-size: 14px; color: var(--dim); }
.group-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--dim); }

/* -- Row list -- */
.row-list { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 14px; align-items: center;
  padding: 11px 4px; text-decoration: none; color: var(--text);
  border-bottom: 1px solid var(--border); transition: background 0.1s;
}
.row:hover { background: var(--bg2); }
.row-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row-strain { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-shrink: 1; }
.row-thc { font-size: 11px; color: var(--dim); font-family: 'DM Mono', monospace; white-space: nowrap; }
.row-weight { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; }
.row-price { font-size: 14px; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--text); white-space: nowrap; }

/* -- Rating widget (VaporTrails match) -- sits inline right after the strain name */
.rating-widget { display: flex; align-items: center; gap: 5px; white-space: nowrap; flex-shrink: 0; }
.rating-badge { font-size: 15px; }
.suggest-label {
  color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px;
  max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.thumb {
  background: var(--bg3); border: 1px solid var(--border2); border-radius: 6px;
  padding: 1px 6px; font-size: 11px; cursor: pointer; line-height: 1.5;
}
.thumb:hover { border-color: var(--amber); }
.rate-search {
  background: var(--bg3); border: 1px solid var(--border); color: var(--dim);
  border-radius: 6px; padding: 2px 8px; font-size: 9px; font-family: 'DM Mono', monospace; cursor: pointer;
}
.rate-search:hover { color: var(--text); border-color: var(--border2); }
.manual-select {
  background: var(--bg3); border: 1px solid var(--border2); color: var(--text);
  font-size: 11px; padding: 4px 6px; border-radius: 6px; max-width: 150px;
}
.manual-confirm-btn { background: var(--teal-dim); border-color: var(--teal); color: var(--teal); }

.row-added {
  font-size: 10px; font-family: 'DM Mono', monospace; padding: 3px 7px; border-radius: 100px;
  white-space: nowrap; text-align: center;
}
.row-added.age-fresh  { background: var(--teal-dim);  color: var(--teal); }
.row-added.age-recent { background: var(--blue-dim);  color: var(--blue); }
.row-added.age-aging  { background: var(--amber-dim); color: var(--amber); }
.row-added.age-stale  { background: var(--coral-dim); color: var(--coral); }

@media (max-width: 640px) {
  .row { grid-template-columns: 1fr auto auto; row-gap: 4px; }
  .row-thc, .row-added { display: none; }
}

.empty { padding: 60px 20px; text-align: center; color: var(--dim); font-family: 'DM Mono', monospace; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="logo">FreshFlower</div>
    <div class="stat-pill"><strong id="stat-count">-</strong> variants &middot; <strong id="stat-groups">-</strong> search groups</div>
  </div>
  <div class="filters">
    <div class="ms" id="ms-store"></div>
    <div class="ms" id="ms-brand"></div>
    <div class="ms" id="ms-weight"></div>
    <div class="ms" id="ms-new"></div>
    <button class="clear-filters" id="clear-filters-btn">Clear filters</button>
    <button class="clear-filters" id="search-groups-list-btn">Search Groups List</button>
    <button class="clear-filters" id="add-search-group-btn">Add Search Groups</button>
    <button class="clear-filters" id="brand-match-btn">Brand Match</button>
  </div>
</header>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box"></div>
</div>

<main id="main">
  <div class="state-msg"><div class="spinner"></div><br>Loading&hellip;</div>
</main>

<script>
// -- Config -------------------------------------------------------------------
const SUPABASE_URL  = "https://oapjuqurbfimxopjpqgj.supabase.co";
const SUPABASE_ANON = "sb_publishable_B6dXNLCuGE3n3z5qazgdLg_ZE-S4ZLr";
// (age color tiers are defined inline in render(): <=30d green, <=60d blue, <=90d amber, older red)

// Some brands appear under slightly different names depending on which
// store's site they're scraped from. Map each raw name to one canonical
// display name so the brand filter treats them as a single option — e.g.
// selecting "UpNorth" also matches products tagged "UpNorth Humboldt".
// Add more pairs here as new naming variants turn up.
const BRAND_ALIASES = {
  "moon valley cannabis":  "Moon Valley",
  "moon valley organics":  "Moon Valley",
  "seed junky":            "Seed Junky",
  "seed junky genetics":   "Seed Junky",
  "snowtill":              "Snowtill",
  "snowtill organics":     "Snowtill",
  "upnorth":               "UpNorth",
  "upnorth humboldt":      "UpNorth",
  "team elite genetics":   "Team Elite Genetics",
  "cam":                   "Cam",
  "cam private reserve":   "Cam",
  "bosky":                 "Bosky",
  "bosky genetics":        "Bosky",
};
function canonicalBrand(raw) {
  const key = (raw ?? "").toLowerCase().trim();
  return BRAND_ALIASES[key] || (raw ?? "").trim();
}

// FreshFlower → VaporTrails brand mapping now lives in flower.brand_matches
// (editable via the "Brand Match" modal) instead of being hardcoded here.
// brandMatches is populated in init() / refreshed after any edit.
function vtBrandFor(ffCanonicalBrand) {
  const key = (ffCanonicalBrand ?? "").toLowerCase().trim();
  const m = brandMatches.find(x => (x.ff_brand ?? "").toLowerCase().trim() === key);
  return m ? m.vt_brand : null;
}
// VaporTrails brand names sometimes have decorative emoji attached (e.g.
// "Fig Farms 🌿", "Wizard Trees🧙🏻‍♂️") that aren't part of the actual brand
// identity. Strip those before comparing so matching works regardless.
function stripDecorative(s) {
  return (s ?? "")
    .replace(/[^\x00-\x7F]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function brandsMatch(a, b) {
  return stripDecorative(a).toLowerCase() === stripDecorative(b).toLowerCase();
}
// --------------------------------------------------------------------------------

const API = (path, opts = {}) => {
  const { headers: extraHeaders, ...restOpts } = opts;
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      "apikey":          SUPABASE_ANON,
      "Authorization":   `Bearer ${SUPABASE_ANON}`,
      "Content-Type":    "application/json",
      "Accept-Profile":  "flower",
      "Content-Profile": "flower",
      "Prefer":          "return=representation",
      ...extraHeaders,
    },
    ...restOpts,
  });
};

// VaporTrails lives in the same Supabase project's `public` schema.
const VT_API = (path) => fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
  headers: {
    "apikey":         SUPABASE_ANON,
    "Authorization":  `Bearer ${SUPABASE_ANON}`,
    "Accept-Profile": "public",
  },
});

let allProducts = [];
let vtStrains = [];       // [{ id, brand, strain, rating }]
let strainMatches = [];   // [{ ff_brand, ff_strain, vt_strain_id, status }]
let brandMatches = [];    // [{ ff_brand, vt_brand }]
let filters = { stores: new Set(), brands: new Set(), weights: new Set(), newness: "" };

async function fetchProducts() {
  // current_inventory view already joins in search_group title/store/brand/weight
  // and filters to is_available + weight >= 3.5g.
  const res = await API(
    `current_inventory?select=jane_product_id,brand,strain,lineage,weight_grams,` +
    `weight_label,price,thc_pct,product_url,first_seen_at,search_group_title,` +
    `search_group_url,search_group_store,search_group_brand,search_group_weight` +
    `&order=search_group_title.asc,strain.asc,weight_grams.asc`
  );
  if (!res.ok) throw new Error(`Products fetch failed: ${res.status}`);
  return res.json();
}

async function fetchVtStrains() {
  try {
    const res = await VT_API("strains?select=id,brand,strain,rating");
    if (!res.ok) return [];
    return res.json();
  } catch (e) {
    return []; // VaporTrails being unreachable shouldn't break the FreshFlower dashboard
  }
}

async function fetchStrainMatches() {
  try {
    const res = await API("strain_matches?select=ff_brand,ff_strain,vt_strain_id,status");
    if (!res.ok) return [];
    return res.json();
  } catch (e) {
    return [];
  }
}

async function fetchBrandMatches() {
  try {
    const res = await API("brand_matches?select=ff_brand,vt_brand");
    if (!res.ok) return [];
    return res.json();
  } catch (e) {
    return [];
  }
}

// -- Search Groups list / add ------------------------------------------------
function weightSortKey(label) {
  if (!label) return 9999; // groups with no fixed weight (split-by-weight) sort last
  const m = String(label).match(/([\d.]+)/);
  return m ? parseFloat(m[1]) : 9999;
}

function detectPlatform(url) {
  try {
    const host = new URL(url).hostname.toLowerCase();
    if (host.includes("iheartjane.com")) return "jane";
    if (host.includes("exotixflower.com") || host.includes("getmeadow.com")) return "meadow";
    if (host.includes("shopharborside.com")) return "dutchie";
  } catch (e) { /* invalid URL, handled by caller */ }
  return null;
}

function openModal(html) {
  document.getElementById("modal-box").innerHTML = html;
  document.getElementById("modal-overlay").classList.add("open");
}
function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
  document.getElementById("modal-box").innerHTML = "";
}
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") closeModal();
});

async function openSearchGroupsListModal() {
  openModal(`<h2>Search Groups <button class="modal-close" data-action="close-modal">&times;</button></h2><p class="modal-hint">Loading&hellip;</p>`);
  const res = await API("search_groups?select=title,store,brand,weight_label,url");
  const groups = res.ok ? await res.json() : [];
  groups.sort((a, b) =>
    (a.store || "").localeCompare(b.store || "") ||
    (a.brand || "").localeCompare(b.brand || "") ||
    weightSortKey(a.weight_label) - weightSortKey(b.weight_label)
  );
  const rows = groups.map(g => `
    <tr>
      <td>${escapeHtml(g.store || "")}</td>
      <td>${escapeHtml(g.brand || "")}</td>
      <td>${escapeHtml(g.weight_label || "(by weight)")}</td>
      <td><a href="${escapeHtml(g.url)}" target="_blank" rel="noopener" style="color:var(--amber)">Open &#8599;</a></td>
    </tr>
  `).join("");
  openModal(`
    <h2>Search Groups <button class="modal-close" data-action="close-modal">&times;</button></h2>
    <table class="sg-list-table">
      <thead><tr><th>Store</th><th>Brand</th><th>Weight</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4" class="modal-hint">No search groups found.</td></tr>`}</tbody>
    </table>
  `);
}

async function fetchAllSearchGroups() {
  const res = await API("search_groups?select=*");
  return res.ok ? await res.json() : [];
}

function getAllCanonicalFFBrands(groups) {
  return [...new Set(groups.map(g => canonicalBrand(g.brand)).filter(Boolean))].sort();
}

async function openBrandMatchModal() {
  openModal(`<h2>Brand Match <button class="modal-close" data-action="close-modal">&times;</button></h2><p class="modal-hint">Loading&hellip;</p>`);
  const groups = await fetchAllSearchGroups();
  const ffBrands = getAllCanonicalFFBrands(groups);
  const vtBrandOptions = [...new Set(vtStrains.map(v => v.brand).filter(Boolean))].sort();

  const rows = ffBrands.map(ff => {
    const existing = brandMatches.find(m => (m.ff_brand ?? "").toLowerCase().trim() === ff.toLowerCase());
    if (existing) {
      return `<tr>
        <td>${escapeHtml(ff)}</td>
        <td>${escapeHtml(existing.vt_brand)}</td>
        <td><button class="thumb" data-action="unmatch-brand" data-ff-brand="${escapeHtml(ff)}">Unmatch</button></td>
      </tr>`;
    }
    const options = vtBrandOptions.map(vt => `<option value="${escapeHtml(vt)}">${escapeHtml(vt)}</option>`).join("");
    return `<tr>
      <td>${escapeHtml(ff)}</td>
      <td colspan="2">
        <select class="manual-select brand-match-select">
          <option value="">Pick VaporTrails brand&hellip;</option>
          ${options}
        </select>
        <button class="thumb" data-action="save-brand-match" data-ff-brand="${escapeHtml(ff)}">Save</button>
      </td>
    </tr>`;
  }).join("");

  openModal(`
    <h2>Brand Match <button class="modal-close" data-action="close-modal">&times;</button></h2>
    <table class="sg-list-table">
      <thead><tr><th>FreshFlower Brand</th><th>VaporTrails Match</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="3" class="modal-hint">No FreshFlower brands found yet.</td></tr>`}</tbody>
    </table>
  `);
}

async function saveBrandMatch(ffBrand, rowEl) {
  const select = rowEl.querySelector(".brand-match-select");
  const vtBrand = select ? select.value : "";
  if (!vtBrand) return;
  await API("brand_matches?on_conflict=ff_brand", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify({ ff_brand: ffBrand, vt_brand: vtBrand }),
  });
  brandMatches = brandMatches.filter(m => (m.ff_brand ?? "").toLowerCase() !== ffBrand.toLowerCase());
  brandMatches.push({ ff_brand: ffBrand, vt_brand: vtBrand });
  render();
  openBrandMatchModal();
}

async function unmatchBrand(ffBrand) {
  await API(`brand_matches?ff_brand=eq.${encodeURIComponent(ffBrand)}`, { method: "DELETE" });
  brandMatches = brandMatches.filter(m => (m.ff_brand ?? "").toLowerCase() !== ffBrand.toLowerCase());
  render();
  openBrandMatchModal();
}

async function openAddSearchGroupModal() {
  const groups = await fetchAllSearchGroups();
  const ffBrands = getAllCanonicalFFBrands(groups);
  const brandOptions = ffBrands.map(b => `<option value="${escapeHtml(b)}">`).join("");

  openModal(`
    <h2>Add Search Group <button class="modal-close" data-action="close-modal">&times;</button></h2>
    <div class="modal-field">
      <label>Store</label>
      <input type="text" id="asg-store" placeholder="e.g. Cake House">
    </div>
    <div class="modal-field">
      <label>Brand</label>
      <input type="text" id="asg-brand" placeholder="e.g. Fig Farms" list="asg-brand-list" autocomplete="off">
      <datalist id="asg-brand-list">${brandOptions}</datalist>
    </div>
    <div class="modal-field">
      <label>Weight</label>
      <input type="text" id="asg-weight" placeholder="e.g. 3.5g &mdash; leave blank to filter by weight">
      <div class="modal-hint">Leave blank if the URL doesn't filter by weight &mdash; results will be grouped by whatever weight is actually found.</div>
    </div>
    <div class="modal-field">
      <label>URL</label>
      <input type="text" id="asg-url" placeholder="https://...">
      <div id="asg-platform-hint" class="modal-hint"></div>
    </div>
    <div id="asg-error" class="modal-warn" style="display:none;"></div>
    <div class="modal-actions">
      <button class="modal-btn-primary" data-action="submit-add-search-group">Add</button>
    </div>
  `);
  document.getElementById("asg-url").addEventListener("input", (e) => {
    const platform = detectPlatform(e.target.value.trim());
    const hint = document.getElementById("asg-platform-hint");
    if (!e.target.value.trim()) { hint.textContent = ""; return; }
    hint.textContent = platform
      ? `Detected platform: ${platform}`
      : `Couldn't auto-detect a known platform from this URL — this group may not scrape correctly until that's set manually.`;
  });
}

async function submitAddSearchGroup() {
  const store  = document.getElementById("asg-store").value.trim();
  const brand  = document.getElementById("asg-brand").value.trim();
  const weight = document.getElementById("asg-weight").value.trim();
  const url    = document.getElementById("asg-url").value.trim();
  const errorEl = document.getElementById("asg-error");
  errorEl.style.display = "none";

  if (!store || !brand || !url) {
    errorEl.textContent = "Store, Brand, and URL are all required.";
    errorEl.style.display = "block";
    return;
  }
  let parsedUrl;
  try { parsedUrl = new URL(url); } catch (e) {
    errorEl.textContent = "That doesn't look like a valid URL.";
    errorEl.style.display = "block";
    return;
  }

  const platform = detectPlatform(url);
  const title = `${store} - ${brand}${weight ? " - " + weight : ""}`;

  const res = await API("search_groups?on_conflict=title", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify({
      title, url: parsedUrl.href, store, brand,
      weight_label: weight || null,
      platform: platform || null,
      split_by_weight: !weight,
    }),
  });

  if (!res.ok) {
    const text = await res.text().catch(() => "");
    errorEl.textContent = `Couldn't save: ${res.status} ${text}`.slice(0, 200);
    errorEl.style.display = "block";
    return;
  }
  openModal(`
    <h2>Added <button class="modal-close" data-action="close-modal">&times;</button></h2>
    <p class="modal-hint">"${escapeHtml(title)}" was saved. It'll start showing products after the next scheduled scrape run picks it up.</p>
    <div class="modal-actions">
      <button class="modal-btn-primary" data-action="close-modal">Done</button>
    </div>
  `);
}

document.getElementById("search-groups-list-btn").addEventListener("click", openSearchGroupsListModal);
document.getElementById("add-search-group-btn").addEventListener("click", openAddSearchGroupModal);
document.getElementById("modal-box").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  if (btn.dataset.action === "close-modal") closeModal();
  if (btn.dataset.action === "submit-add-search-group") submitAddSearchGroup();
  if (btn.dataset.action === "save-brand-match") saveBrandMatch(btn.dataset.ffBrand, btn.closest("tr"));
  if (btn.dataset.action === "unmatch-brand") unmatchBrand(btn.dataset.ffBrand);
});
document.getElementById("brand-match-btn").addEventListener("click", openBrandMatchModal);

// -- Fuzzy strain matching --------------------------------------------------
function normalizeStrainName(s) {
  return (s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}
function strainSimilarity(a, b) {
  const na = normalizeStrainName(a), nb = normalizeStrainName(b);
  if (!na || !nb) return 0;
  if (na === nb) return 1;
  if (na.includes(nb) || nb.includes(na)) return 0.85;
  const wordsA = new Set(na.split(" ").filter(Boolean));
  const wordsB = new Set(nb.split(" ").filter(Boolean));
  const common = [...wordsA].filter(w => wordsB.has(w)).length;
  const total = new Set([...wordsA, ...wordsB]).size;
  return total === 0 ? 0 : common / total;
}
function findBestVtMatch(ffStrain, vtCandidates) {
  let best = null, bestScore = 0;
  for (const vt of vtCandidates) {
    const score = strainSimilarity(ffStrain, vt.strain);
    if (score > bestScore) { bestScore = score; best = vt; }
  }
  return bestScore >= 0.3 ? best : null;
}

const RATING_EMOJI = { Great: "\u{1F525}", OK: "\u{1F333}", NG: "\u{1F5D1}\u{FE0F}" };

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function daysAgo(iso) {
  return (Date.now() - new Date(iso).getTime()) / 86400000;
}

function buildMultiSelect(containerId, allLabel, options, selectedSet) {
  const container = document.getElementById(containerId);
  const summary = selectedSet.size === 0
    ? allLabel
    : selectedSet.size === 1
      ? [...selectedSet][0]
      : `${selectedSet.size} selected`;

  container.innerHTML = `
    <button class="ms-btn" type="button">
      <span>${escapeHtml(summary)}</span>
      <span class="arrow">&#9662;</span>
    </button>
    <div class="ms-panel">
      ${options.map(opt => `
        <label class="ms-option">
          <input type="checkbox" value="${escapeHtml(opt)}" ${selectedSet.has(opt) ? "checked" : ""}>
          ${escapeHtml(opt)}
        </label>
      `).join("")}
    </div>
  `;

  const btn = container.querySelector(".ms-btn");
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const wasOpen = container.classList.contains("open");
    document.querySelectorAll(".ms.open").forEach(el => el.classList.remove("open"));
    if (!wasOpen) container.classList.add("open");
  });
  container.querySelector(".ms-panel").addEventListener("click", (e) => e.stopPropagation());
  container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.checked) selectedSet.add(cb.value);
      else selectedSet.delete(cb.value);
      render();
      // Re-render just this widget's button label without closing the panel
      const newSummary = selectedSet.size === 0 ? allLabel
        : selectedSet.size === 1 ? [...selectedSet][0]
        : `${selectedSet.size} selected`;
      container.querySelector(".ms-btn span").textContent = newSummary;
    });
  });
}
document.addEventListener("click", () => {
  document.querySelectorAll(".ms.open").forEach(el => el.classList.remove("open"));
});

function buildSingleSelect(containerId, allLabel, options, selectedValue, onSelect) {
  // options: [{ value, label }]. Single choice (radio), not checkboxes —
  // closes on selection since there's nothing to "add more" of.
  const container = document.getElementById(containerId);
  const current = options.find(o => o.value === selectedValue);
  const summary = current ? current.label : allLabel;

  container.innerHTML = `
    <button class="ms-btn" type="button">
      <span>${escapeHtml(summary)}</span>
      <span class="arrow">&#9662;</span>
    </button>
    <div class="ms-panel">
      <label class="ms-option">
        <input type="radio" name="${containerId}-radio" value="" ${selectedValue === "" ? "checked" : ""}>
        ${escapeHtml(allLabel)}
      </label>
      ${options.map(opt => `
        <label class="ms-option">
          <input type="radio" name="${containerId}-radio" value="${escapeHtml(opt.value)}" ${selectedValue === opt.value ? "checked" : ""}>
          ${escapeHtml(opt.label)}
        </label>
      `).join("")}
    </div>
  `;

  const btn = container.querySelector(".ms-btn");
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const wasOpen = container.classList.contains("open");
    document.querySelectorAll(".ms.open").forEach(el => el.classList.remove("open"));
    if (!wasOpen) container.classList.add("open");
  });
  container.querySelector(".ms-panel").addEventListener("click", (e) => e.stopPropagation());
  container.querySelectorAll('input[type="radio"]').forEach(rb => {
    rb.addEventListener("change", () => {
      onSelect(rb.value);
      container.classList.remove("open");
    });
  });
}

function populateFilterOptions() {
  const stores  = [...new Set(allProducts.map(p => p.search_group_store).filter(Boolean))].sort();
  const brands  = [...new Set(allProducts.map(p => canonicalBrand(p.search_group_brand)).filter(Boolean))].sort();
  const weights = [...new Set(allProducts.map(p => p.search_group_weight).filter(Boolean))]
    .sort((a, b) => parseFloat(a) - parseFloat(b));

  buildMultiSelect("ms-store", "All stores", stores, filters.stores);
  buildMultiSelect("ms-brand", "All brands", brands, filters.brands);
  buildMultiSelect("ms-weight", "All weights", weights, filters.weights);
  buildSingleSelect("ms-new", "New", [
    { value: "today", label: "As of Today" },
    { value: "week",  label: "As of This Week" },
    { value: "month", label: "As of This Month" },
  ], filters.newness, (value) => { filters.newness = value; render(); });
}

function findStrainMatch(ffBrand, ffStrain) {
  const b = ffBrand.toLowerCase(), s = ffStrain.toLowerCase();
  return strainMatches.find(m => m.ff_brand.toLowerCase() === b && m.ff_strain.toLowerCase() === s);
}

function renderRatingWidget(p) {
  const canonical = canonicalBrand(p.search_group_brand);
  const vtBrand = vtBrandFor(canonical);
  if (!vtBrand) return `<div class="rating-widget"></div>`;

  const vtCandidates = vtStrains.filter(v => brandsMatch(v.brand, vtBrand));
  const existing = findStrainMatch(p.brand, p.strain);
  const dataAttrs = `data-ff-brand="${escapeHtml(p.brand)}" data-ff-strain="${escapeHtml(p.strain)}" data-vt-brand="${escapeHtml(vtBrand)}"`;

  if (existing) {
    if (existing.status === "no_match") return `<div class="rating-widget"></div>`;
    const vt = vtStrains.find(v => v.id === existing.vt_strain_id);
    if (!vt || !vt.rating || !RATING_EMOJI[vt.rating]) return `<div class="rating-widget"></div>`;
    return `<div class="rating-widget"><span class="rating-badge" title="${escapeHtml(vt.strain)}">${RATING_EMOJI[vt.rating]}</span></div>`;
  }

  const suggestion = findBestVtMatch(p.strain, vtCandidates);
  if (!suggestion) {
    if (vtCandidates.length === 0) return `<div class="rating-widget"></div>`;
    return `<div class="rating-widget" ${dataAttrs}>
      <button class="rate-search" data-action="reject">Match?</button>
    </div>`;
  }

  const emoji = suggestion.rating && RATING_EMOJI[suggestion.rating] ? ` ${RATING_EMOJI[suggestion.rating]}` : "";
  return `<div class="rating-widget" ${dataAttrs} data-vt-id="${suggestion.id}">
    <span class="suggest-label" title="${escapeHtml(suggestion.strain)}">${escapeHtml(suggestion.strain)}${emoji}</span>
    <button class="thumb" data-action="confirm" title="Confirm match">&#128077;</button>
    <button class="thumb" data-action="reject" title="Wrong match">&#128078;</button>
  </div>`;
}

function openManualPicker(widgetEl, ffBrand, ffStrain, vtBrand) {
  const candidates = vtStrains
    .filter(v => brandsMatch(v.brand, vtBrand))
    .sort((a, b) => a.strain.localeCompare(b.strain));
  const options = candidates.map(v => {
    const emoji = v.rating && RATING_EMOJI[v.rating] ? ` ${RATING_EMOJI[v.rating]}` : "";
    return `<option value="${v.id}">${escapeHtml(v.strain)}${emoji}</option>`;
  }).join("");
  widgetEl.dataset.ffBrand = ffBrand;
  widgetEl.dataset.ffStrain = ffStrain;
  widgetEl.innerHTML = `
    <select class="manual-select">
      <option value="">Pick the right strain&hellip;</option>
      ${options}
      <option value="__nomatch__">No match exists</option>
    </select>
    <button class="thumb manual-confirm-btn" data-action="manual-confirm" title="Save">&#10003;</button>
  `;
}

async function confirmMatch(ffBrand, ffStrain, vtStrainId) {
  await API(`strain_matches?on_conflict=ff_brand,ff_strain`, {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify({ ff_brand: ffBrand, ff_strain: ffStrain, vt_strain_id: vtStrainId, status: "confirmed" }),
  });
  strainMatches = strainMatches.filter(m => !(m.ff_brand === ffBrand && m.ff_strain === ffStrain));
  strainMatches.push({ ff_brand: ffBrand, ff_strain: ffStrain, vt_strain_id: vtStrainId, status: "confirmed" });
  render();
}

async function saveNoMatch(ffBrand, ffStrain) {
  await API(`strain_matches?on_conflict=ff_brand,ff_strain`, {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify({ ff_brand: ffBrand, ff_strain: ffStrain, vt_strain_id: null, status: "no_match" }),
  });
  strainMatches = strainMatches.filter(m => !(m.ff_brand === ffBrand && m.ff_strain === ffStrain));
  strainMatches.push({ ff_brand: ffBrand, ff_strain: ffStrain, vt_strain_id: null, status: "no_match" });
  render();
}

document.getElementById("main").addEventListener("click", (e) => {
  const widget = e.target.closest(".rating-widget");
  if (!widget) return;
  // Any click inside the widget (including opening the <select>, before an
  // option is even chosen) must not trigger the row's own link navigation,
  // now that the widget lives inside the <a>.
  e.preventDefault();
  e.stopPropagation();

  const btn = e.target.closest("[data-action]");
  if (!btn) return; // clicked inside the widget but not an action button
  const action = btn.dataset.action;

  if (action === "confirm") {
    confirmMatch(widget.dataset.ffBrand, widget.dataset.ffStrain, parseInt(widget.dataset.vtId, 10));
  } else if (action === "reject") {
    openManualPicker(widget, widget.dataset.ffBrand, widget.dataset.ffStrain, widget.dataset.vtBrand);
  } else if (action === "manual-confirm") {
    const select = widget.querySelector(".manual-select");
    const val = select.value;
    if (val === "__nomatch__") {
      saveNoMatch(widget.dataset.ffBrand, widget.dataset.ffStrain);
    } else if (val) {
      confirmMatch(widget.dataset.ffBrand, widget.dataset.ffStrain, parseInt(val, 10));
    }
  }
});

function render() {
  const main = document.getElementById("main");

  const newnessOk = (p) => {
    if (!filters.newness) return true;
    if (!p.first_seen_at) return false;
    const age = daysAgo(p.first_seen_at);
    if (filters.newness === "today") return age < 1;
    if (filters.newness === "week")  return age <= 7;
    if (filters.newness === "month") return age <= 30;
    return true;
  };

  const filtered = allProducts.filter(p =>
    (filters.stores.size  === 0 || filters.stores.has(p.search_group_store)) &&
    (filters.brands.size  === 0 || filters.brands.has(canonicalBrand(p.search_group_brand))) &&
    (filters.weights.size === 0 || filters.weights.has(p.search_group_weight)) &&
    newnessOk(p)
  );

  document.getElementById("stat-count").textContent = filtered.length;

  if (filtered.length === 0) {
    main.innerHTML = `<div class="empty">No products match the current filters.</div>`;
    document.getElementById("stat-groups").textContent = "0";
    return;
  }

  // Group by search_group_title, preserving the sorted order already returned by the query.
  const groups = new Map();
  for (const p of filtered) {
    const key = p.search_group_title || "Ungrouped";
    if (!groups.has(key)) groups.set(key, { url: p.search_group_url, items: [] });
    groups.get(key).items.push(p);
  }
  document.getElementById("stat-groups").textContent = groups.size;

  let html = "";
  for (const [title, group] of groups) {
    html += `<div class="group">`;
    html += `<div class="group-header">`;
    if (group.url) {
      html += `<a class="group-title" href="${escapeHtml(group.url)}" target="_blank" rel="noopener">${escapeHtml(title)} <span class="arrow">&#8599;</span></a>`;
    } else {
      html += `<div class="group-title">${escapeHtml(title)}</div>`;
    }
    html += `<span class="group-count">${group.items.length} item${group.items.length === 1 ? "" : "s"}</span>`;
    html += `</div>`;
    html += `<div class="row-list">`;
    for (const p of group.items) {
      const ageDays = p.first_seen_at ? daysAgo(p.first_seen_at) : null;
      let ageClass = "age-stale";
      if (ageDays != null) {
        if (ageDays <= 30) ageClass = "age-fresh";
        else if (ageDays <= 60) ageClass = "age-recent";
        else if (ageDays <= 90) ageClass = "age-aging";
        else ageClass = "age-stale";
      }
      const addedLabel = p.first_seen_at
        ? new Date(p.first_seen_at).toLocaleDateString(undefined, { month: "short", day: "numeric" })
        : "-";
      const thc = p.thc_pct != null ? `THC ${p.thc_pct}%` : "";
      const href = p.product_url || "#";
      html += `<a class="row" href="${escapeHtml(href)}" target="_blank" rel="noopener">`;
      html += `  <div class="row-main">`;
      html += `    <div class="row-strain">${escapeHtml(p.strain || "Unknown")}</div>`;
      html += renderRatingWidget(p);
      html += `  </div>`;
      html += `  <div class="row-thc">${escapeHtml(thc)}</div>`;
      html += `  <div class="row-weight">${escapeHtml(p.weight_label || "")}</div>`;
      html += `  <div class="row-price">$${p.price != null ? Number(p.price).toFixed(2) : "-"}</div>`;
      html += `  <div class="row-added ${ageClass}">Added ${escapeHtml(addedLabel)}</div>`;
      html += `</a>`;
    }
    html += `</div></div>`;
  }
  main.innerHTML = html;
}

async function init() {
  try {
    [allProducts, vtStrains, strainMatches, brandMatches] = await Promise.all([
      fetchProducts(),
      fetchVtStrains(),
      fetchStrainMatches(),
      fetchBrandMatches(),
    ]);
    populateFilterOptions();
    render();
  } catch (err) {
    document.getElementById("main").innerHTML =
      `<div class="state-msg">Could not load data:<br>${escapeHtml(err.message)}</div>`;
  }
}

document.getElementById("clear-filters-btn").addEventListener("click", () => {
  filters = { stores: new Set(), brands: new Set(), weights: new Set(), newness: "" };
  populateFilterOptions();
  render();
});

init();
</script>

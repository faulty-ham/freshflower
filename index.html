<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>FreshFlower</title>
<meta name="theme-color" content="#13131c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0d0d12; --bg2:     #13131c; --bg3:    #1a1a27;
  --border:  rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #e8e6f0; --muted: #7a789a; --dim: #4a4868;
  --amber:  #f0a832; --amber-dim: rgba(240,168,50,0.12);
  --teal:   #2dd4a0; --teal-dim:  rgba(45,212,160,0.10);
  --coral:  #f06060; --coral-dim: rgba(240,96,96,0.10);
  --blue:   #4a90e2; --blue-dim:  rgba(74,144,226,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100dvh; }

/* -- Header -- */
header {
  background: var(--bg2); border-bottom: 1px solid var(--border2);
  padding: 16px 20px; position: sticky; top: 0; z-index: 10;
}
.header-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; color: var(--amber); line-height: 1; }
.stat-pill {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 100px;
  padding: 5px 12px; font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap;
}
.stat-pill strong { color: var(--text); }

/* -- Filters -- */
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.filters select {
  background: var(--bg3); border: 1px solid var(--border2); color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 8px 12px; border-radius: 8px;
  outline: none; cursor: pointer; min-width: 130px;
}
.filters select:hover { border-color: var(--amber); }
.clear-filters {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  font-size: 12px; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-family: 'DM Mono', monospace;
}
.clear-filters:hover { color: var(--text); border-color: var(--border2); }

/* -- Content -- */
main { max-width: 900px; margin: 0 auto; padding: 20px; }
.state-msg { text-align: center; padding: 60px 20px; color: var(--dim); font-family: 'DM Mono', monospace; font-size: 13px; }
.spinner {
  width: 24px; height: 24px; border: 2px solid var(--border2); border-top-color: var(--amber);
  border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite; margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* -- Search group section -- */
.group { margin-bottom: 28px; }
.group-header {
  display: flex; align-items: baseline; gap: 10px; padding: 10px 4px;
  border-bottom: 1px solid var(--border2); margin-bottom: 2px; flex-wrap: wrap;
}
.group-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px;
  color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 6px;
}
.group-title:hover { color: var(--amber); }
.group-title .arrow { font-size: 14px; color: var(--dim); }
.group-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--dim); }

/* -- Row list -- */
.row-list { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 14px; align-items: center;
  padding: 11px 4px; text-decoration: none; color: var(--text);
  border-bottom: 1px solid var(--border); transition: background 0.1s;
}
.row:hover { background: var(--bg2); }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-strain { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-thc { font-size: 11px; color: var(--dim); font-family: 'DM Mono', monospace; white-space: nowrap; }
.row-weight { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; }
.row-price { font-size: 14px; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--text); white-space: nowrap; }
.row-added {
  font-size: 10px; font-family: 'DM Mono', monospace; padding: 3px 7px; border-radius: 100px;
  white-space: nowrap; text-align: center;
}
.row-added.age-fresh  { background: var(--teal-dim);  color: var(--teal); }
.row-added.age-recent { background: var(--blue-dim);  color: var(--blue); }
.row-added.age-aging  { background: var(--amber-dim); color: var(--amber); }
.row-added.age-stale  { background: var(--coral-dim); color: var(--coral); }

@media (max-width: 640px) {
  .row { grid-template-columns: 1fr auto auto; row-gap: 4px; }
  .row-thc, .row-added { display: none; }
}

.empty { padding: 60px 20px; text-align: center; color: var(--dim); font-family: 'DM Mono', monospace; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="logo">FreshFlower</div>
    <div class="stat-pill"><strong id="stat-count">-</strong> variants &middot; <strong id="stat-groups">-</strong> search groups</div>
  </div>
  <div class="filters">
    <select id="filter-store"><option value="">All stores</option></select>
    <select id="filter-brand"><option value="">All brands</option></select>
    <select id="filter-weight"><option value="">All weights</option></select>
    <button class="clear-filters" id="clear-filters-btn">Clear filters</button>
  </div>
</header>

<main id="main">
  <div class="state-msg"><div class="spinner"></div><br>Loading&hellip;</div>
</main>

<script>
// -- Config --------------------------------------------------------------------
const SUPABASE_URL  = "https://oapjuqurbfimxopjpqgj.supabase.co";
const SUPABASE_ANON = "sb_publishable_B6dXNLCuGE3n3z5qazgdLg_ZE-S4ZLr";
// (age color tiers are defined inline in render(): <=30d green, <=60d blue, <=90d amber, older red)
// --------------------------------------------------------------------------------

const API = (path) => fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
  headers: {
    "apikey":         SUPABASE_ANON,
    "Authorization":  `Bearer ${SUPABASE_ANON}`,
    "Accept-Profile": "flower",
  },
});

let allProducts = [];
let filters = { store: "", brand: "", weight: "" };

async function fetchProducts() {
  // current_inventory view already joins in search_group title/store/brand/weight
  // and filters to is_available + weight >= 3.5g.
  const res = await API(
    `current_inventory?select=jane_product_id,brand,strain,lineage,weight_grams,` +
    `weight_label,price,thc_pct,product_url,first_seen_at,search_group_title,` +
    `search_group_url,search_group_store,search_group_brand,search_group_weight` +
    `&order=search_group_title.asc,strain.asc,weight_grams.asc`
  );
  if (!res.ok) throw new Error(`Products fetch failed: ${res.status}`);
  return res.json();
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function daysAgo(iso) {
  return (Date.now() - new Date(iso).getTime()) / 86400000;
}

function populateFilterOptions() {
  const stores  = [...new Set(allProducts.map(p => p.search_group_store).filter(Boolean))].sort();
  const brands  = [...new Set(allProducts.map(p => p.search_group_brand).filter(Boolean))].sort();
  const weights = [...new Set(allProducts.map(p => p.search_group_weight).filter(Boolean))]
    .sort((a, b) => parseFloat(a) - parseFloat(b));

  const fill = (id, values, current) => {
    const sel = document.getElementById(id);
    const placeholder = sel.options[0];
    sel.innerHTML = "";
    sel.appendChild(placeholder);
    values.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v; opt.textContent = v;
      if (v === current) opt.selected = true;
      sel.appendChild(opt);
    });
  };
  fill("filter-store", stores, filters.store);
  fill("filter-brand", brands, filters.brand);
  fill("filter-weight", weights, filters.weight);
}

function render() {
  const main = document.getElementById("main");

  const filtered = allProducts.filter(p =>
    (!filters.store  || p.search_group_store  === filters.store) &&
    (!filters.brand  || p.search_group_brand  === filters.brand) &&
    (!filters.weight || p.search_group_weight === filters.weight)
  );

  document.getElementById("stat-count").textContent = filtered.length;

  if (filtered.length === 0) {
    main.innerHTML = `<div class="empty">No products match the current filters.</div>`;
    document.getElementById("stat-groups").textContent = "0";
    return;
  }

  // Group by search_group_title, preserving the sorted order already returned by the query.
  const groups = new Map();
  for (const p of filtered) {
    const key = p.search_group_title || "Ungrouped";
    if (!groups.has(key)) groups.set(key, { url: p.search_group_url, items: [] });
    groups.get(key).items.push(p);
  }
  document.getElementById("stat-groups").textContent = groups.size;

  let html = "";
  for (const [title, group] of groups) {
    html += `<div class="group">`;
    html += `<div class="group-header">`;
    if (group.url) {
      html += `<a class="group-title" href="${escapeHtml(group.url)}" target="_blank" rel="noopener">${escapeHtml(title)} <span class="arrow">&#8599;</span></a>`;
    } else {
      html += `<div class="group-title">${escapeHtml(title)}</div>`;
    }
    html += `<span class="group-count">${group.items.length} item${group.items.length === 1 ? "" : "s"}</span>`;
    html += `</div>`;
    html += `<div class="row-list">`;
    for (const p of group.items) {
      const ageDays = p.first_seen_at ? daysAgo(p.first_seen_at) : null;
      let ageClass = "age-stale";
      if (ageDays != null) {
        if (ageDays <= 30) ageClass = "age-fresh";
        else if (ageDays <= 60) ageClass = "age-recent";
        else if (ageDays <= 90) ageClass = "age-aging";
        else ageClass = "age-stale";
      }
      const addedLabel = p.first_seen_at
        ? new Date(p.first_seen_at).toLocaleDateString(undefined, { month: "short", day: "numeric" })
        : "-";
      const thc = p.thc_pct != null ? `THC ${p.thc_pct}%` : "";
      const href = p.product_url || "#";
      html += `<a class="row" href="${escapeHtml(href)}" target="_blank" rel="noopener">`;
      html += `  <div class="row-main">`;
      html += `    <div class="row-strain">${escapeHtml(p.strain || "Unknown")}</div>`;
      html += `  </div>`;
      html += `  <div class="row-thc">${escapeHtml(thc)}</div>`;
      html += `  <div class="row-weight">${escapeHtml(p.weight_label || "")}</div>`;
      html += `  <div class="row-price">$${p.price != null ? Number(p.price).toFixed(2) : "-"}</div>`;
      html += `  <div class="row-added ${ageClass}">Added ${escapeHtml(addedLabel)}</div>`;
      html += `</a>`;
    }
    html += `</div></div>`;
  }
  main.innerHTML = html;
}

async function init() {
  try {
    allProducts = await fetchProducts();
    populateFilterOptions();
    render();
  } catch (err) {
    document.getElementById("main").innerHTML =
      `<div class="state-msg">Could not load data:<br>${escapeHtml(err.message)}</div>`;
  }
}

document.getElementById("filter-store").addEventListener("change", e => { filters.store = e.target.value; render(); });
document.getElementById("filter-brand").addEventListener("change", e => { filters.brand = e.target.value; render(); });
document.getElementById("filter-weight").addEventListener("change", e => { filters.weight = e.target.value; render(); });
document.getElementById("clear-filters-btn").addEventListener("click", () => {
  filters = { store: "", brand: "", weight: "" };
  document.getElementById("filter-store").value = "";
  document.getElementById("filter-brand").value = "";
  document.getElementById("filter-weight").value = "";
  render();
});

init();
</script>
</body>
</html>
